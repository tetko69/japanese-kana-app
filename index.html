<div class="card" style="background:#fff7fa;border-color:#f0d5df">
<div class="section-title">📱 iPhone Safari 使用</div>

</div>
<div class="card"><div class="section-head"><div class="section-title">今日學習</div><button class="sound" id="speakA">▶ あいうえお</button></div><div class="progress"><i id="homeProgress"></i></div><p id="homeText" class="foot"></p></div>
</section>

<section id="kana" class="screen"><div class="card"><div class="section-title">五十音表</div>

<section id="practice" class="screen"><div class="card"><div class="section-title">✍️ 手寫練習</div>
<div class="seg"><button class="active" id="ph">ひらがな</button><button id="pk">カタカナ</button></div>
<div class="mode"><button class="active" data-mode="trace">① 描紅</button><button data-mode="hint">② 隱藏範本</button><button data-mode="free">③ 默寫</button></div>
<div id="practiceArea"></div></div></section>

<section id="quiz" class="screen"><div class="card quiz"><div class="section-title">🎧 聽音選假名</div><p class="foot">先按「播放」，再選出你聽到嘅讀音。語速已調慢，優先使用裝置較自然嘅日語聲音。</p><button class="sound" id="playQuiz">🔊 播放（慢速）</button><div class="qkana" id="qKana">あ</div><div class="choices" id="choices"></div><div class="msg" id="qMsg">準備好就開始。</div><button class="action" id="nextQuiz" style="margin-top:10px;text-align:center">下一題 →</button></div></section>

</main></div><div class="toast" id="toast"></div>

   const ai=preferred.findIndex(n=>a.name.includes(n)), bi=preferred.findIndex(n=>b.name.includes(n));
   const aa=ai<0?999:ai, bb=bi<0?999:bi;
   return aa-bb;
 })[0] || jp[0] || null;
}
function speak(t,rate=.70){
 if(!("speechSynthesis"in window)){pop("此瀏覽器未支援日語語音");return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);
 u.lang="ja-JP"; u.rate=rate; u.pitch=1.0; u.volume=1.0;
 const v=getBestJapaneseVoice();
 if(v) u.voice=v;
 const play=()=>speechSynthesis.speak(u);
 if(speechSynthesis.getVoices().length){play();}
 else{
   const once=()=>{speechSynthesis.removeEventListener("voiceschanged",once);play()};
   speechSynthesis.addEventListener("voiceschanged",once);
   setTimeout(()=>{speechSynthesis.removeEventListener("voiceschanged",once);play()},350);
 }
}
function renderTable(){const rows=script==="hiragana"?HR:KR, box=document.getElementById("kanaRows");box.innerHTML="";const ns=["あ","か","さ","た","な","は","ま","や","ら","わ","ん"];
rows.forEach((r,i)=>{const sec=document.createElement("div");sec.className="card";sec.style.marginBottom="9px";sec.innerHTML=`<div class="rowtitle">${ns[i]}行</div><div class="row"></div>`;const grid=sec.querySelector(".row");r.forEach(k=>{const b=document.createElement("button");b.type="button";b.className="kbtn";if(!k)b.style.visibility="hidden";else{if(done[script+"_"+k])b.classList.add("done");if(k===selected)b.classList.add("sel");b.innerHTML=k+"<small>"+item(script,k).romaji+"　🔊</small>";b.onclick=()=>{selected=k;renderTable();renderDetail();setTimeout(()=>speak(k,.62),40)}}grid.appendChild(b)});box.appendChild(sec)})}
function renderDetail(){const o=item(script,selected),d=document.getElementById("detail");let svg="";
if(script==="hiragana"&&STROKES[selected]){svg=`<div class="mini"><div class="minihead">筆順示範</div><svg viewBox="0 0 110 100">${STROKES[selected].map((p,i)=>`<path class="stroke" d="${p}" style="stroke-dasharray:160;stroke-dashoffset:160;animation:dash .75s ease forwards ${i*.55}s"></path>`).join("")}</svg><button class="action" id="replay">↻ 重新播放</button></div>`}
else{svg=`<div class="mini"><div class="minihead">筆順</div><div style="font-size:100px;text-align:center;color:var(--pink)">${selected}</div><div class="note">可以直接進入手寫練習，配合十字格練習字形。</div></div>`}
d.innerHTML=`<div class="card"><div class="detailhead"><div class="big">${selected}</div><div><h2>${selected}　${o.romaji}</h2><span class="pill">${script==="hiragana"?"平仮名":"片仮名"}</span><br><button class="sound" id="detailSound">🔊 發音</button></div></div></div>
<div class="card"><div class="section-title">📜 字源・筆順</div><div class="two"><div class="mini"><div class="minihead">來源漢字</div><div class="origin">${o.origin}</div><div class="note">${script==="hiragana"?"平假名由漢字草書體演變而來。":"片假名取自漢字的一部分。"}</div></div>${svg}</div></div>
<div class="card"><div class="section-title">🔤 常用單字（3個）</div><div>${o.words.map(w=>`<div class="word"><div class="emo">${w.emoji}</div><div><strong>${w.word}</strong><small>${w.reading} · ${w.meaning}</small></div><button data-s="${w.word}">🔊</button></div>`).join("")}</div></div>
<div class="card"><div class="section-title">💬 簡單例句（3句）</div><div>${o.examples.map(e=>`<div class="ex"><strong>${e.jp}</strong><small>${e.zh}</small><button data-s="${e.jp}">🔊 聽</button></div>`).join("")}</div></div>
<div class="card"><div class="section-title">✍️ 手寫練習</div><p class="foot">描紅 → 隱藏範本 → 默寫。</p><button class="action" id="detailPractice" style="text-align:center">開始手寫 ${selected} →</button></div>`;
document.getElementById("detailSound").onclick=()=>speak(selected,.62);d.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>speak(b.dataset.s));
const rp=document.getElementById("replay");if(rp)rp.onclick=()=>d.querySelectorAll("path").forEach((p,i)=>{p.style.animation="none";void p.offsetWidth;p.style.animation=`dash .75s ease forwards ${i*.55}s`});
document.getElementById("detailPractice").onclick=()=>{pKana=selected;go("practice");renderPractice()}
}
let cvs,ctx,box,lines=[],activeLine=null;
function setupCanvas(){box=document.getElementById("drawBox");cvs=document.getElementById("writeCanvas");ctx=cvs.getContext("2d");const resize=()=>{const r=box.getBoundingClientRect(),d=devicePixelRatio||1;cvs.width=r.width*d;cvs.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=6;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#d94b78";redraw()};setTimeout(resize,20);window.addEventListener("resize",resize);
const p=e=>{const r=cvs.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};cvs.onpointerdown=e=>{e.preventDefault();activeLine=[p(e)];lines.push(activeLine);cvs.setPointerCapture?.(e.pointerId)};cvs.onpointermove=e=>{if(!activeLine)return;e.preventDefault();activeLine.push(p(e));redraw()};const up=()=>activeLine=null;cvs.onpointerup=up;cvs.onpointercancel=up}
function redraw(){if(!ctx)return;const r=box.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);lines.forEach(s=>{if(!s.length)return;ctx.beginPath();s.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()})}
function renderPractice(){const sc=K2H[pKana]?"katakana":"hiragana",o=item(sc,pKana),k=pKana;lines=[];
document.getElementById("practiceArea").innerHTML=`<div class="writegrid"><div class="mini"><div class="minihead">お手本</div><div class="writebox"><div class="ghost">${k}</div></div><div class="msg">${k}　${o.romaji}</div></div><div class="mini"><div class="minihead">請喺呢度寫</div><div class="writebox" id="drawBox"><div class="ghost" id="wg">${k}</div><canvas id="writeCanvas"></canvas></div><div class="ctrl"><button id="undo">↶ 復原</button><button id="clear">🧹 清除</button><button class="done" id="finish">✓ 完成</button></div><div class="msg" id="pm">薄色範本開啟中，請跟住寫。</div></div></div><div class="ctrl"><button id="prev">← 上一個</button><button id="next">下一個 →</button></div>`;
document.getElementById("wg").classList.toggle("hide",pMode!=="trace");setupCanvas();
document.getElementById("clear").onclick=()=>{lines=[];redraw();document.getElementById("pm").textContent="已清除，可以重新寫。"};document.getElementById("undo").onclick=()=>{lines.pop();redraw();document.getElementById("pm").textContent="已復原上一筆。"};document.getElementById("finish").onclick=()=>{if(!lines.length){document.getElementById("pm").textContent="請先寫一寫 😊";return}done[sc+"_"+k]=true;save();document.getElementById("pm").textContent="✓ 做得好！已記錄今次練習。"};
const arr=Object.keys(DATA[sc]),i=arr.indexOf(k);document.getElementById("prev").onclick=()=>{pKana=arr[(i-1+arr.length)%arr.length];renderPractice()};document.getElementById("next").onclick=()=>{pKana=arr[(i+1)%arr.length];renderPractice()}
}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{pMode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("active",x.dataset.mode===pMode));renderPractice()});
document.getElementById("hTab").onclick=()=>{script="hiragana";selected="あ";document.getElementById("hTab").classList.add("active");document.getElementById("kTab").classList.remove("active");renderTable();renderDetail()};
document.getElementById("kTab").onclick=()=>{script="katakana";selected="ア";document.getElementById("kTab").classList.add("active");document.getElementById("hTab").classList.remove("active");renderTable();renderDetail()};
document.getElementById("ph").onclick=()=>{pKana="あ";document.getElementById("ph").classList.add("active");document.getElementById("pk").classList.remove("active");renderPractice()};
document.getElementById("pk").onclick=()=>{pKana="ア";document.getElementById("pk").classList.add("active");document.getElementById("ph").classList.remove("active");renderPractice()};
document.getElementById("speakA").onclick=()=>speak("あいうえお",.65);

function newQuiz(){const pool=Object.keys(DATA.hiragana),c=pool[Math.floor(Math.random()*pool.length)],ans=DATA.hiragana[c].romaji,opts=[ans];while(opts.length<3){const x=DATA.hiragana[pool[Math.floor(Math.random()*pool.length)]].romaji;if(!opts.includes(x))opts.push(x)}opts.sort(()=>Math.random()-.5);quiz={char:c};document.getElementById("qKana").textContent=c;document.getElementById("qMsg").textContent="先按發音，再選答案。";document.getElementById("choices").innerHTML=opts.map(x=>`<button class="choice" data-a="${x}">${x}</button>`).join("");document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{if(b.dataset.a===ans){b.classList.add("good");document.getElementById("qMsg").textContent="✓ 正確！";done["quiz_"+c]=true;save()}else{b.classList.add("bad");document.getElementById("qMsg").textContent="✕ 再試一次。"}})}
document.getElementById("playQuiz").onclick=()=>speak(quiz.char,.58);document.getElementById("nextQuiz").onclick=newQuiz;

function updateProgress(){const h=Object.keys(DATA.hiragana),k=Object.keys(DATA.katakana),total=h.length+k.length,finished=h.filter(x=>done["hiragana_"+x]).length+k.filter(x=>done["katakana_"+x]).length,p=Math.round(finished/total*100);document.getElementById("homeProgress").style.width=p+"%";document.getElementById("homeText").textContent=`已完成 ${finished}/${total} 個假名（約 ${p}%）。`;document.getElementById("allProgress").style.width=p+"%";document.getElementById("sum").textContent=`進度保存在此瀏覽器。已完成 ${finished}/${total} 個假名。`;
const box=document.getElementById("progList");box.innerHTML=`<div class="section-title">平假名</div>`;HR.forEach((r,i)=>box.innerHTML+=`<div class="rowtitle">${["あ","か","さ","た","な","は","ま","や","ら","わ","ん"][i]}行</div><div class="row">${r.filter(Boolean).map(c=>`<div class="kbtn ${done["hiragana_"+c]?"done":""}" style="cursor:default">${c}<small>${done["hiragana_"+c]?"✓":"未練習"}</small></div>`).join("")}</div>`);box.innerHTML+=`<div class="section-title" style="margin-top:16px">片假名</div>`;KR.forEach((r,i)=>box.innerHTML+=`<div class="rowtitle">${["ア","カ","サ","タ","ナ","ハ","マ","ヤ","ラ","ワ","ン"][i]}行</div><div class="row">${r.filter(Boolean).map(c=>`<div class="kbtn ${done["katakana_"+c]?"done":""}" style="cursor:default">${c}<small>${done["katakana_"+c]?"✓":"未練習"}</small></div>`).join("")}</div>`)}
renderTable();renderDetail();renderPractice();newQuiz();updateProgress();
</script>
